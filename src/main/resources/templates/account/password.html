<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Change password', null, 'password', ~{::main})}">
<body>
<main class="narrow">
    <h1>Change password</h1>
    <p class="subtitle">You stay logged in here. The mobile app and other devices will ask you to log in again.</p>

    <p th:if="${message}" class="notice" th:text="${message}">Password changed</p>

    <form th:action="@{/account/password}" th:object="${form}" method="post">
        <p th:each="err : ${#fields.globalErrors()}" class="error" th:text="${err}">Something went wrong</p>

        <label>
            Current password
            <input type="password" th:field="*{currentPassword}" required autocomplete="current-password"
                   th:attr="aria-invalid=${#fields.hasErrors('currentPassword')} ? 'true' : null">
            <small class="error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}">Wrong password</small>
        </label>

        <label>
            New password
            <input type="password" th:field="*{newPassword}" minlength="8" required autocomplete="new-password"
                   th:attr="aria-invalid=${#fields.hasErrors('newPassword')} ? 'true' : null">
            <small class="muted">At least 8 characters.</small>
            <small class="error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">Too short</small>
        </label>

        <label>
            Repeat new password
            <input type="password" th:field="*{confirmPassword}" minlength="8" required autocomplete="new-password"
                   th:attr="aria-invalid=${#fields.hasErrors('confirmPassword')} ? 'true' : null">
            <small class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Passwords do not match</small>
        </label>

        <div class="buttons">
            <button type="submit">Change password</button>
        </div>
    </form>
</main>
</body>
</html>
