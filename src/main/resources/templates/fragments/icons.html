<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<svg th:fragment="icon(name)" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <th:block th:switch="${name}">
        <th:block th:case="'home'">
            <path d="M3 10.5 12 3l9 7.5"/>
            <path d="M5 9.5V21h14V9.5"/>
            <path d="M10 21v-6h4v6"/>
        </th:block>
        <th:block th:case="'menu'">
            <path d="M5 3v7a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2V3"/>
            <path d="M7.5 12v9"/>
            <path d="M18 21V3c-2.2 1-3.5 3.6-3.5 7v3H18"/>
        </th:block>
        <th:block th:case="'modifiers'">
            <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/>
            <circle cx="16" cy="6" r="2"/>
            <circle cx="10" cy="12" r="2"/>
            <circle cx="18" cy="18" r="2"/>
        </th:block>
        <th:block th:case="'staff'">
            <circle cx="9" cy="8" r="3.5"/>
            <path d="M2.5 20a6.5 6.5 0 0 1 13 0"/>
            <path d="M16 4.5a3.5 3.5 0 0 1 0 7"/>
            <path d="M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>
        </th:block>
        <th:block th:case="'venues'">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </th:block>
        <th:block th:case="'stop'">
            <circle cx="12" cy="12" r="9"/>
            <path d="M5.6 5.6l12.8 12.8"/>
        </th:block>
        <th:block th:case="'logout'">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="M16 17l5-5-5-5"/>
            <path d="M21 12H9"/>
        </th:block>
        <th:block th:case="'switch'">
            <path d="m8 9 4-4 4 4"/>
            <path d="m16 15-4 4-4-4"/>
        </th:block>
        <th:block th:case="'clock'">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 2"/>
        </th:block>
    </th:block>
</svg>
</body>
</html>
