<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<ul th:fragment="tree(nodes, venueId, stations)" class="tree">
    <li th:each="node : ${nodes}">
        <div class="node">
            <a th:href="@{/admin/venues/{v}/categories/{c}/items(v=${venueId}, c=${node.id})}"
               th:text="${node.name}" th:classappend="${node.active} ? '' : 'inactive'">Wine</a>
            <span class="badge" th:if="${node.station != null}" th:text="${node.station}" title="Station">Bar</span>
            <span class="actions">
                <a th:href="@{/admin/venues/{v}/categories/{c}/edit(v=${venueId}, c=${node.id})}"
                   role="button" class="outline secondary" title="Edit category">✎</a>
                <form th:action="@{/admin/venues/{v}/categories/{c}/shift(v=${venueId}, c=${node.id})}" method="post">
                    <input type="hidden" name="delta" value="-1">
                    <button type="submit" class="outline secondary" th:disabled="${node.first}" title="Move up">↑</button>
                </form>
                <form th:action="@{/admin/venues/{v}/categories/{c}/shift(v=${venueId}, c=${node.id})}" method="post">
                    <input type="hidden" name="delta" value="1">
                    <button type="submit" class="outline secondary" th:disabled="${node.last}" title="Move down">↓</button>
                </form>
                <form th:action="@{/admin/venues/{v}/categories/{c}/delete(v=${venueId}, c=${node.id})}" method="post"
                      onsubmit="return confirm('Delete this category?')">
                    <button type="submit" class="outline contrast" title="Delete">✕</button>
                </form>
            </span>
        </div>
        <details class="add-sub">
            <summary>Add subcategory</summary>
            <form th:action="@{/admin/venues/{v}/categories(v=${venueId})}" method="post" role="group">
                <input type="hidden" name="parentId" th:value="${node.id}">
                <input name="name" placeholder="Subcategory" required maxlength="120" aria-label="Subcategory name">
                <select name="stationId" aria-label="Station">
                    <option value="">Same station as the parent</option>
                    <option th:each="station : ${stations}" th:value="${station.id}" th:text="${station.name}">Kitchen</option>
                </select>
                <button type="submit">Add</button>
            </form>
        </details>
        <th:block th:unless="${node.children.isEmpty()}">
            <ul th:replace="~{fragments/category-tree :: tree(${node.children}, ${venueId}, ${stations})}"></ul>
        </th:block>
    </li>
</ul>
</body>
</html>
