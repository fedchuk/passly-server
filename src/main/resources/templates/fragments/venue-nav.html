<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="tabs(venue, active)" class="venue-tabs">
    <ul>
        <li><a th:href="@{/admin/venues/{v}(v=${venue.id})}"
               th:attr="aria-current=${active == 'menu'} ? 'page' : null">Menu</a></li>
        <li><a th:href="@{/admin/venues/{v}/modifier-groups(v=${venue.id})}"
               th:attr="aria-current=${active == 'modifiers'} ? 'page' : null">Modifier groups</a></li>
    </ul>
</nav>
</body>
</html>
