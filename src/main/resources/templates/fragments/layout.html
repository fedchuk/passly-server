<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, venue, active, content)">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Passly'">Passly</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <a class="brand" th:href="@{/admin}">
            <span class="brand-mark"><svg th:replace="~{fragments/icons :: icon('menu')}"></svg></span>
            <span>
                <strong>Passly</strong>
                <small>Restaurant admin</small>
            </span>
        </a>

        <nav class="side-nav" th:if="${venue != null}" aria-label="Venue">
            <a th:href="@{/admin/venues/{v}/overview(v=${venue.id})}"
               th:attr="aria-current=${active == 'overview'} ? 'page' : null">
                <svg th:replace="~{fragments/icons :: icon('home')}"></svg>Overview</a>
            <a th:href="@{/admin/venues/{v}(v=${venue.id})}"
               th:attr="aria-current=${active == 'menu'} ? 'page' : null">
                <svg th:replace="~{fragments/icons :: icon('menu')}"></svg>Menu</a>
            <a th:href="@{/admin/venues/{v}/modifier-groups(v=${venue.id})}"
               th:attr="aria-current=${active == 'modifiers'} ? 'page' : null">
                <svg th:replace="~{fragments/icons :: icon('modifiers')}"></svg>Modifier groups</a>
            <a th:if="${venue.tablesManageable}" th:href="@{/admin/venues/{v}/floor(v=${venue.id})}"
               th:attr="aria-current=${active == 'floor'} ? 'page' : null">
                <svg th:replace="~{fragments/icons :: icon('tables')}"></svg>Tables</a>
            <a th:if="${venue.staffManageable}" th:href="@{/admin/venues/{v}/staff(v=${venue.id})}"
               th:attr="aria-current=${active == 'staff'} ? 'page' : null">
                <svg th:replace="~{fragments/icons :: icon('staff')}"></svg>Staff</a>
        </nav>

        <nav class="side-nav" th:if="${venue == null}" aria-label="Main">
            <a th:if="${currentUser != null and currentUser.platformAdmin}" th:href="@{/platform}"
               th:attr="aria-current=${active == 'businesses'} ? 'page' : null">
                <svg th:replace="~{fragments/icons :: icon('business')}"></svg>Businesses</a>
            <a th:unless="${currentUser != null and currentUser.platformAdmin}" th:href="@{/admin}"
               th:attr="aria-current=${active == 'venues'} ? 'page' : null">
                <svg th:replace="~{fragments/icons :: icon('venues')}"></svg>My venues</a>
        </nav>

        <a th:if="${venue != null}" class="venue-switch" th:href="@{/admin}" title="Switch venue">
            <span class="venue-avatar" th:text="${#strings.toUpperCase(#strings.substring(venue.name, 0, 1))}">B</span>
            <span class="venue-switch-text">
                <strong th:text="${venue.name}">Bistro Centro</strong>
                <small th:text="${venue.roleLabel}">Manager</small>
            </span>
            <svg th:replace="~{fragments/icons :: icon('switch')}"></svg>
        </a>
    </aside>

    <div class="workspace">
        <header class="topbar" th:if="${currentUser != null}">
            <details class="user-menu">
                <summary class="user" aria-label="Account menu">
                    <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(currentUser.displayName, 0, 1))}">M</span>
                    <span class="user-name" th:text="${currentUser.displayName}">Max</span>
                    <svg th:replace="~{fragments/icons :: icon('chevron')}"></svg>
                </summary>
                <div class="user-menu-panel">
                    <div class="user-menu-header">
                        <strong th:text="${currentUser.displayName}">Max</strong>
                        <small class="muted" th:text="${currentUser.username}">max@example.com</small>
                    </div>
                    <a class="user-menu-item" th:href="@{/account/password}"
                       th:attr="aria-current=${active == 'password'} ? 'page' : null">
                        <svg th:replace="~{fragments/icons :: icon('lock')}"></svg>
                        <span>Change password</span>
                    </a>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="user-menu-item">
                            <svg th:replace="~{fragments/icons :: icon('logout')}"></svg>
                            <span>Log out</span>
                        </button>
                    </form>
                </div>
            </details>
        </header>
        <main th:replace="${content}"></main>
    </div>
</div>
<script>
    document.addEventListener('click', event => {
        document.querySelectorAll('.user-menu[open]').forEach(menu => {
            if (!menu.contains(event.target)) menu.open = false;
        });
    });

    document.addEventListener('keydown', event => {
        if (event.key !== 'Escape') return;
        document.querySelectorAll('.user-menu[open]').forEach(menu => {
            menu.open = false;
            menu.querySelector('summary').focus();
        });
    });
</script>
</body>
</html>
