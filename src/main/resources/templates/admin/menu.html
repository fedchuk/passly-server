<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Menu', ${venue}, 'menu', ~{::main})}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1>Menu</h1>
            <p class="subtitle">Open a category to see its subcategories and dishes. Drag <span class="grip-hint">⋮⋮</span> to change the order.</p>
        </div>
        <details class="add-category" th:unless="${stations.isEmpty()}">
            <summary role="button">+ Add category</summary>
            <form class="add-category-form" th:action="@{/admin/venues/{v}/categories(v=${venue.id})}" method="post">
                <label>
                    Name
                    <input name="name" placeholder="Desserts" required maxlength="120">
                </label>
                <label>
                    Station
                    <select name="stationId" required>
                        <option value="" disabled selected>Choose a station</option>
                        <option th:each="station : ${stations}" th:value="${station.id}" th:text="${station.name}">Kitchen</option>
                    </select>
                </label>
                <label th:unless="${taxRates.isEmpty()}">
                    Tax rate
                    <select name="taxRateId" required>
                        <option th:each="taxRate, state : ${taxRates}" th:value="${taxRate.id}" th:text="${taxRate.name}"
                                th:selected="${state.first}">Food and soft drinks · 10%</option>
                    </select>
                </label>
                <button type="submit" class="wide">Add category</button>
            </form>
        </details>
    </div>

    <p th:if="${message}" class="notice" th:text="${message}">Category added</p>
    <p th:if="${error}" class="error" th:text="${error}">Something went wrong</p>

    <p th:if="${stations.isEmpty()}" class="notice">
        Orders of every category go to a station.
        <a th:href="@{/admin/venues/{v}/stations(v=${venue.id})}">Add a station</a> first, for example the kitchen.
    </p>

    <div th:if="${roots.isEmpty()}" class="placeholder">
        <svg th:replace="~{fragments/icons :: icon('menu')}"></svg>
        <p>No categories yet. Add the first one, for example Starters.</p>
    </div>

    <input type="hidden" id="order-csrf" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <section class="menu-accordion" aria-label="Categories"
             th:data-order-url="@{/admin/venues/{v}/categories/order(v=${venue.id})}"
             data-draggable=".menu-node" data-handle=".handle-d0">
        <th:block th:each="root : ${roots}">
            <article th:replace="~{fragments/menu-node :: node(${root}, 0)}"></article>
        </th:block>
    </section>

    <script th:src="@{/webjars/sortablejs/1.15.7/Sortable.min.js}"></script>
    <script th:src="@{/js/menu-order.js}"></script>
</main>
</body>
</html>
