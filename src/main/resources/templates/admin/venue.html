<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Menu', ${venue}, 'menu', ~{::main})}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1>Menu</h1>
            <p class="subtitle">Categories can be nested. Open a category to manage its items.</p>
        </div>
    </div>

    <p th:if="${message}" class="notice" th:text="${message}">Category added</p>
    <p th:if="${error}" class="error" th:text="${error}">Something went wrong</p>

    <section class="card">
        <form th:action="@{/admin/venues/{v}/categories(v=${venue.id})}" method="post" role="group">
            <input name="name" placeholder="New category" required maxlength="120" aria-label="Category name">
            <button type="submit">Add</button>
        </form>

        <p th:if="${tree.isEmpty()}" class="empty">No categories yet.</p>
        <ul th:replace="~{fragments/category-tree :: tree(${tree}, ${venue.id})}"></ul>
    </section>
</main>
</body>
</html>
