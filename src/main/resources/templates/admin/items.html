<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(${category.name}, ${venue}, 'menu', ~{::main})}">
<body>
<main>
    <nav aria-label="breadcrumb">
        <ul>
            <li><a th:href="@{/admin/venues/{v}(v=${venue.id})}">Menu</a></li>
            <li th:text="${category.name}">Wine</li>
        </ul>
    </nav>

    <div class="page-header">
        <h1 th:text="${category.name}">Wine</h1>
        <a th:href="@{/admin/venues/{v}/categories/{c}/items/new(v=${venue.id}, c=${category.id})}" role="button">Add item</a>
    </div>

    <p th:if="${message}" class="notice" th:text="${message}">Item added</p>
    <p th:if="${error}" class="error" th:text="${error}">Something went wrong</p>

    <p th:if="${items.isEmpty()}">No items in this category yet.</p>

    <div class="overflow-auto" th:unless="${items.isEmpty()}">
        <table class="striped">
            <thead>
            <tr>
                <th>Name</th>
                <th class="number">Price</th>
                <th class="number">VAT</th>
                <th>Station</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td>
                    <a th:href="@{/admin/venues/{v}/items/{i}/edit(v=${venue.id}, i=${item.id})}" th:text="${item.name}">Rioja</a>
                    <small class="muted" th:if="${item.modifierGroupCount > 0}"
                           th:text="|${item.modifierGroupCount} modifier group(s)|">1 modifier group(s)</small>
                </td>
                <td class="number" th:text="${item.price}">4.50</td>
                <td class="number" th:text="${item.taxRate}">10.00%</td>
                <td>
                    <span th:text="${item.station} ?: '—'">Bar</span>
                    <small class="muted" th:if="${item.stationInherited}">(from category)</small>
                </td>
                <td>
                    <form th:action="@{/admin/venues/{v}/items/{i}/availability(v=${venue.id}, i=${item.id})}" method="post" class="status">
                        <input type="hidden" name="available" th:value="${!item.available}">
                        <button type="submit" th:if="${item.available}" class="outline secondary" title="Put on the stop list">In stock</button>
                        <button type="submit" th:unless="${item.available}" class="contrast" title="Back on the menu">Stop list</button>
                    </form>
                </td>
                <td>
                    <span class="actions">
                        <form th:action="@{/admin/venues/{v}/items/{i}/shift(v=${venue.id}, i=${item.id})}" method="post">
                            <input type="hidden" name="delta" value="-1">
                            <button type="submit" class="outline secondary" th:disabled="${item.first}" title="Move up">↑</button>
                        </form>
                        <form th:action="@{/admin/venues/{v}/items/{i}/shift(v=${venue.id}, i=${item.id})}" method="post">
                            <input type="hidden" name="delta" value="1">
                            <button type="submit" class="outline secondary" th:disabled="${item.last}" title="Move down">↓</button>
                        </form>
                        <form th:action="@{/admin/venues/{v}/items/{i}/archive(v=${venue.id}, i=${item.id})}" method="post"
                              onsubmit="return confirm('Archive this item? It disappears from the menu.')">
                            <button type="submit" class="outline contrast" title="Archive">✕</button>
                        </form>
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
