<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('My venues', null, 'venues', ~{::main})}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1>My venues</h1>
            <p class="subtitle">Choose a venue to start working.</p>
        </div>
    </div>

    <p th:if="${venues.isEmpty()}" class="empty">You do not work at any venue yet.</p>

    <div class="venue-grid">
        <th:block th:each="venue : ${venues}">
            <a th:if="${venue.home != null}" class="venue-card" th:href="@{${venue.home}}">
                <span class="venue-avatar" th:text="${#strings.toUpperCase(#strings.substring(venue.name, 0, 1))}">B</span>
                <span>
                    <strong th:text="${venue.name}">Bistro Centro</strong>
                    <span class="badge" th:text="${venue.roleLabel}">Owner</span>
                </span>
            </a>
            <div th:unless="${venue.home != null}" class="venue-card disabled">
                <span class="venue-avatar" th:text="${#strings.toUpperCase(#strings.substring(venue.name, 0, 1))}">B</span>
                <span>
                    <strong th:text="${venue.name}">Bistro Centro</strong>
                    <span class="badge" th:text="${venue.roleLabel}">Waiter</span>
                    <small class="muted">There is no workspace for this role yet.</small>
                </span>
            </div>
        </th:block>
    </div>
</main>
</body>
</html>
