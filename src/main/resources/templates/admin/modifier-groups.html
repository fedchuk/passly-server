<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Modifier groups', ${venue}, 'modifiers', ~{::main})}">
<body>
<main>
    <div class="page-header">
        <h1>Modifier groups</h1>
        <a th:href="@{/admin/venues/{v}/modifier-groups/new(v=${venue.id})}" role="button">Add group</a>
    </div>

    <p th:if="${message}" class="notice" th:text="${message}">Group added</p>
    <p th:if="${error}" class="error" th:text="${error}">Something went wrong</p>

    <p th:if="${groups.isEmpty()}">
        No modifier groups yet. They let guests choose options such as doneness, size or extras.
    </p>

    <div class="overflow-auto" th:unless="${groups.isEmpty()}">
        <table class="striped">
            <thead>
            <tr>
                <th>Name</th>
                <th>Rule</th>
                <th>Options</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="group : ${groups}">
                <td><a th:href="@{/admin/venues/{v}/modifier-groups/{g}/edit(v=${venue.id}, g=${group.id})}" th:text="${group.name}">Doneness</a></td>
                <td th:text="${group.rule}">Choose 1</td>
                <td th:text="${group.options}">Rare, Medium, Well done (+0.50)</td>
                <td>
                    <span class="actions">
                        <form th:action="@{/admin/venues/{v}/modifier-groups/{g}/delete(v=${venue.id}, g=${group.id})}" method="post"
                              onsubmit="return confirm('Delete this modifier group?')">
                            <button type="submit" class="outline contrast" title="Delete">✕</button>
                        </form>
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
