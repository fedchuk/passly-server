<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Edit category', ${venue}, 'menu', ~{::main})}">
<body>
<main class="narrow">
    <nav aria-label="breadcrumb">
        <ul>
            <li><a th:href="@{/admin/venues/{v}(v=${venue.id})}">Menu</a></li>
            <li>Edit category</li>
        </ul>
    </nav>
    <h1>Edit category</h1>

    <form th:action="@{/admin/venues/{v}/categories/{c}(v=${venue.id}, c=${categoryId})}" th:object="${form}" method="post">
        <p th:each="err : ${#fields.globalErrors()}" class="error" th:text="${err}">Changed by someone else</p>

        <input type="hidden" th:field="*{version}">

        <label>
            Name
            <input th:field="*{name}" maxlength="120"
                   th:attr="aria-invalid=${#fields.hasErrors('name')} ? 'true' : null">
            <small class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name must not be blank</small>
        </label>

        <label>
            Station
            <select th:field="*{stationId}" th:required="${topLevel}">
                <option th:unless="${topLevel}" value=""
                        th:text="${inheritedStation != null} ? 'Same as the parent (' + ${inheritedStation} + ')' : 'Same as the parent'">Same as the parent (Kitchen)</option>
                <option th:each="station : ${stations}" th:value="${station.id}" th:text="${station.name}">Kitchen</option>
            </select>
            <small class="muted" th:if="${topLevel}">Items of this category and its subcategories are prepared here unless they choose another station.</small>
        </label>

        <label>
            <input type="checkbox" th:field="*{active}">
            Active (shown in the waiter app)
        </label>

        <div class="buttons">
            <button type="submit">Save</button>
            <a th:href="@{/admin/venues/{v}(v=${venue.id})}" role="button" class="secondary outline">Cancel</a>
        </div>
    </form>
    <h2>Move to</h2>
    <form th:action="@{/admin/venues/{v}/categories/{c}/move(v=${venue.id}, c=${categoryId})}" method="post" role="group">
        <select name="parentId" aria-label="Move to">
            <option th:each="option : ${parentOptions}"
                    th:value="${option.value}"
                    th:text="${option.label}"
                    th:selected="${option.id == currentParentId}">Top level</option>
        </select>
        <button type="submit" class="secondary">Move</button>
    </form>
    <p th:unless="${topLevel}"><small class="muted">To move this category to the top level, choose its own station first.</small></p>
</main>
</body>
</html>
