<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Hire', ${venue}, 'staff', ~{::main})}">
<body>
<main class="narrow">
    <nav aria-label="breadcrumb">
        <ul>
            <li><a th:href="@{/admin/venues/{v}/staff(v=${venue.id})}">Staff</a></li>
            <li>Hire</li>
        </ul>
    </nav>
    <h1>Hire</h1>

    <form th:action="@{/admin/venues/{v}/staff(v=${venue.id})}" th:object="${form}" method="post">
        <p th:each="err : ${#fields.globalErrors()}" class="error" th:text="${err}">Something went wrong</p>

        <label>
            Name
            <input th:field="*{displayName}" maxlength="120" required autocomplete="off"
                   th:attr="aria-invalid=${#fields.hasErrors('displayName')} ? 'true' : null">
            <small class="error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}">Name must not be blank</small>
        </label>

        <label>
            Email
            <input type="email" th:field="*{email}" maxlength="254" required autocomplete="off"
                   th:attr="aria-invalid=${#fields.hasErrors('email')} ? 'true' : null">
            <small class="muted">They will log in to the Passly app with this email</small>
            <small class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Invalid email</small>
        </label>

        <label>
            Initial password
            <input type="password" th:field="*{password}" minlength="8" required autocomplete="new-password"
                   th:attr="aria-invalid=${#fields.hasErrors('password')} ? 'true' : null">
            <small class="muted">At least 8 characters. Share it with the person in private.</small>
            <small class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Too short</small>
        </label>

        <label>
            Role
            <select th:field="*{roleId}" required
                    th:attr="aria-invalid=${#fields.hasErrors('roleId')} ? 'true' : null">
                <option value="">Choose a role</option>
                <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}">Waiter</option>
            </select>
            <small class="muted" th:if="${venue.rolesManageable}">
                What each role may do is set on the <a th:href="@{/admin/venues/{v}/roles(v=${venue.id})}">Roles</a> page.
            </small>
            <small class="error" th:if="${#fields.hasErrors('roleId')}" th:errors="*{roleId}">Choose a role</small>
        </label>

        <div class="buttons">
            <button type="submit">Hire</button>
            <a th:href="@{/admin/venues/{v}/staff(v=${venue.id})}" role="button" class="secondary outline">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
