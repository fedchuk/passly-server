<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Staff', ${venue}, 'staff', ~{::main})}">
<body>
<main>
    <div class="page-header">
        <h1>Staff</h1>
        <a th:href="@{/admin/venues/{v}/staff/new(v=${venue.id})}" role="button">Hire</a>
    </div>

    <p th:if="${message}" class="notice" th:text="${message}">Anna joined as waiter</p>
    <p th:if="${error}" class="error" th:text="${error}">Something went wrong</p>

    <p th:if="${staff.isEmpty()}">Nobody works here yet. Owners of the business are not listed: they manage every venue.</p>

    <div class="overflow-auto" th:unless="${staff.isEmpty()}">
        <table class="striped">
            <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="member : ${staff}">
                <td>
                    <span th:text="${member.name}">Anna</span>
                    <small class="muted" th:if="${member.you}">(you)</small>
                </td>
                <td th:text="${member.email}">anna@bistro.es</td>
                <td>
                    <span th:unless="${member.changeable}" th:text="${member.roleName}">Manager</span>
                    <form th:if="${member.changeable}" class="inline-role"
                          th:action="@{/admin/venues/{v}/staff/{u}/role(v=${venue.id}, u=${member.userId})}" method="post">
                        <select name="roleId" aria-label="Role">
                            <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"
                                    th:selected="${role.id == member.roleId}">Waiter</option>
                        </select>
                        <button type="submit" class="outline secondary">Change</button>
                    </form>
                </td>
                <td>
                    <span class="actions" th:unless="${member.you}">
                        <form th:action="@{/admin/venues/{v}/staff/{u}/dismiss(v=${venue.id}, u=${member.userId})}" method="post"
                              onsubmit="return confirm('Remove this person from the venue? Their account stays.')">
                            <button type="submit" class="outline contrast" title="Dismiss">✕</button>
                        </form>
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
