spring:
  application:
    name: passly
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/passly}
    username: ${JDBC_DATABASE_USERNAME:passly}
    password: ${JDBC_DATABASE_PASSWORD:passly}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  web:
    locale: en
    locale-resolver: fixed

passly:
  auth:
    issuer: passly
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
  remember-me:
    key: ${REMEMBER_ME_KEY:dev-only-remember-me-key}
  bootstrap:
    business-name: ${BOOTSTRAP_BUSINESS_NAME:}
    venue-name: ${BOOTSTRAP_VENUE_NAME:}
    owner-email: ${BOOTSTRAP_OWNER_EMAIL:}
    owner-name: ${BOOTSTRAP_OWNER_NAME:}
    owner-password: ${BOOTSTRAP_OWNER_PASSWORD:}
  platform-admin:
    email: ${PLATFORM_ADMIN_EMAIL:}
    name: ${PLATFORM_ADMIN_NAME:Platform admin}
    password: ${PLATFORM_ADMIN_PASSWORD:}

server:
  port: ${PORT:8080}

springdoc:
  packages-to-scan: com.passly.web.api
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    tags-sorter: alpha
