spring:
  application:
    name: passly
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/passly}
    username: ${JDBC_DATABASE_USERNAME:passly}
    password: ${JDBC_DATABASE_PASSWORD:passly}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  web:
    locale: en
    locale-resolver: fixed
  auth:
    issuer: passly
    access-token-ttl: 15m
    refresh-token-ttl: 30d

server:
  port: ${PORT:8080}