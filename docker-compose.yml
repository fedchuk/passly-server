services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: passly
      POSTGRES_USER: passly
      POSTGRES_PASSWORD: passly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
volumes:
  pgdata: